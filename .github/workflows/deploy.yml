name: Deploy Next.js Portfolio to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the Docker image on GitHub Actions runner (saves VPS RAM/CPU)
      - name: Build and Export Docker Image
        run: |
          docker build -t portfolio:latest \
            --build-arg DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --build-arg UPLOADTHING_SECRET="${{ secrets.UPLOADTHING_SECRET }}" \
            --build-arg JWT_KEY="${{ secrets.JWT_KEY }}" \
            --build-arg AUTH_SECRET="${{ secrets.AUTH_SECRET }}" \
            --build-arg UPLOADTHING_APP_ID="${{ secrets.UPLOADTHING_APP_ID }}" \
            --build-arg GMAIL_PASS="${{ secrets.GMAIL_PASS }}" \
            --build-arg GMAIL="${{ secrets.GMAIL }}" \
            --build-arg JWT_TOKEN="${{ secrets.JWT_TOKEN }}" \
            --build-arg BLOG_API_KEY="${{ secrets.BLOG_API_KEY }}" \
            --build-arg UPLOADTHING_TOKEN="${{ secrets.UPLOADTHING_TOKEN }}" \
            .
          docker save portfolio:latest | gzip > portfolio.tar.gz

      # Copy the built Docker image tarball to the VPS
      - name: Copy Tarball to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "portfolio.tar.gz"
          target: "/home/${{ secrets.SSH_USER }}/"

      # SSH to the VPS, load the image, recreate the container
      - name: SSH to VPS and Run Container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Ensure Docker is installed on the VPS (fallback check)
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
              sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" -y
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
              sudo usermod -aG docker $USER
            fi

            # Create a directory for the portfolio app configuration / environment if not exists
            sudo mkdir -p /var/www/portfolio
            sudo chown -R $USER:$USER /var/www/portfolio
            
            # Load the Docker image
            sudo docker load -i /home/${{ secrets.SSH_USER }}/portfolio.tar.gz
            rm -f /home/${{ secrets.SSH_USER }}/portfolio.tar.gz

            # Stop and remove existing container if running
            sudo docker stop portfolio || true
            sudo docker rm portfolio || true

            # Run the new container (port 3000 locally, reverse proxied by nginx)
            if [ -f /var/www/portfolio/.env ]; then
              sudo docker run -d \
                --name portfolio \
                --restart always \
                -p 127.0.0.1:3000:3000 \
                --env-file /var/www/portfolio/.env \
                portfolio:latest
            else
              sudo docker run -d \
                --name portfolio \
                --restart always \
                -p 127.0.0.1:3000:3000 \
                portfolio:latest
            fi

            # Clean up old unused images to save disk space
            sudo docker image prune -f
