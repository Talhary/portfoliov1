<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Vibrant premium gold/orange gradient matching your portfolio theme -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5b041" />
      <stop offset="50%" stop-color="#e49505" />
      <stop offset="100%" stop-color="#b77704" />
    </linearGradient>
  </defs>
  <!-- Background: premium graphite smooth squircle -->
  <rect width="32" height="32" rx="9" fill="#121214" />
  
  <!-- Outer glowing orbital arc -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-dasharray="60 20" stroke-linecap="round" opacity="0.8" transform="rotate(-45 16 16)" />
  
  <!-- Monogram T & R futuristic fusion -->
  <!-- Vertical main stem -->
  <rect x="11.5" y="9.5" width="2.5" height="13" rx="1.25" fill="url(#goldGrad)" />
  <!-- Horizontal crossbar -->
  <rect x="9.5" y="9.5" width="13" height="2.5" rx="1.25" fill="url(#goldGrad)" />
  <!-- Curved loop for "R" fusion -->
  <path d="M14 9.5h5a4 4 0 0 1 4 4v0a4 4 0 0 1-4 4h-5v-8z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
  <!-- Diagonal leg for "R" -->
  <path d="M18 17.5l4.5 5" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
</svg>
